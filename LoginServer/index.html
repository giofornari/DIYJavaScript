<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="/login" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Accedi con POST</button>
        <button type="submit" formmethod="get">Accedi con GET</button>
    </form>
    <p>Utente di prova: Mario, password: 1234</p>
</body>
</html>
